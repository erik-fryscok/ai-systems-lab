[project]
name = "ai-systems-lab"
version = "0.1.0"
description = "Experimental lab for model providers, routing, compatibility, benchmarking, and evaluation across local and cloud AI systems."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML==6.0.2"]
license = { text = "MIT" }
authors = [
  { name = "Erik Fryscok" },
]
keywords = [
  "ai-systems",
  "model-providers",
  "openai-compatible",
  "llama.cpp",
  "model-routing",
  "llm-evaluation",
  "benchmarking",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/erik-fryscok/ai-systems-lab"
Documentation = "https://github.com/erik-fryscok/ai-systems-lab#readme"
Issues = "https://github.com/erik-fryscok/ai-systems-lab/issues"
