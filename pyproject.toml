[project]
name = "local-ai-lab"
version = "0.1.0"
description = "Local AI lab for llama.cpp model routing, workload aliases, benchmarking, and evaluation through one OpenAI-compatible gateway."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML==6.0.2"]
license = { text = "MIT" }
authors = [
  { name = "Erik Fryscok" },
]
keywords = [
  "local-ai",
  "local-llm",
  "llama.cpp",
  "model-routing",
  "llm-evaluation",
  "benchmarking",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/erik-fryscok/local-ai-lab"
Documentation = "https://github.com/erik-fryscok/local-ai-lab#readme"
Issues = "https://github.com/erik-fryscok/local-ai-lab/issues"
